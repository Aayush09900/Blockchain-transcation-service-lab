services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: blockchain_transactions
      POSTGRES_USER: transaction_service
      POSTGRES_PASSWORD: change-this-password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transaction_service -d blockchain_transactions"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  api:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      API_TOKEN: change-this-api-token
      DATABASE_URL: postgresql://transaction_service:change-this-password@postgres:5432/blockchain_transactions
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
