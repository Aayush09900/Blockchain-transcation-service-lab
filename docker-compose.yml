services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/mysql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u${MYSQL_USER} -p${MYSQL_PASSWORD} --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  mongo:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:?set MONGO_DATABASE in .env}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set MONGO_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  api:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      API_TOKEN: ${API_TOKEN:?set API_TOKEN in .env}
      MYSQL_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      MYSQL_SSL: "false"
      MYSQL_POOL_MAX: 10
      MONGO_URL: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      MONGO_DATABASE: ${MONGO_DATABASE}
      MONGO_MAX_POOL_SIZE: 20
      MONGO_TLS: "false"
      BLOCKCHAIN_ENABLED: "false"
      CHAIN_RPC_URL: ${CHAIN_RPC_URL:-}
      CHAIN_RPC_URLS: ${CHAIN_RPC_URLS:-}
      CHAIN_CONFIRMATIONS: ${CHAIN_CONFIRMATIONS:-1}
      CHAIN_MAX_FEE_PER_GAS_WEI: ${CHAIN_MAX_FEE_PER_GAS_WEI:-}
      CHAIN_MAX_PRIORITY_FEE_PER_GAS_WEI: ${CHAIN_MAX_PRIORITY_FEE_PER_GAS_WEI:-}
      CHAIN_GAS_LIMIT: ${CHAIN_GAS_LIMIT:-}
      CHAIN_SIGNER_LOCK_TIMEOUT_SECONDS: ${CHAIN_SIGNER_LOCK_TIMEOUT_SECONDS:-10}
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - backend

  outbox-worker:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    build: .
    restart: unless-stopped
    command: ["node", "src/outbox-worker.js"]
    environment:
      NODE_ENV: production
      MYSQL_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      MYSQL_SSL: "false"
      MYSQL_POOL_MAX: 10
      MONGO_URL: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      MONGO_DATABASE: ${MONGO_DATABASE}
      MONGO_MAX_POOL_SIZE: 20
      MONGO_TLS: "false"
      OUTBOX_POLL_MS: 1000
      OUTBOX_BATCH_SIZE: 50
      OUTBOX_LEASE_MS: 60000
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - backend

  blockchain-confirmation-worker:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    profiles: ["blockchain"]
    build: .
    restart: unless-stopped
    command: ["node", "src/blockchain-confirmation-worker.js"]
    environment:
      NODE_ENV: production
      MYSQL_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      MYSQL_SSL: "false"
      MYSQL_POOL_MAX: 10
      CHAIN_RPC_URL: ${CHAIN_RPC_URL:-}
      CHAIN_RPC_URLS: ${CHAIN_RPC_URLS:-}
      CHAIN_ID: ${CHAIN_ID:-}
      CHAIN_CONFIRMATIONS: ${CHAIN_CONFIRMATIONS:-1}
      CHAIN_CONFIRM_POLL_MS: ${CHAIN_CONFIRM_POLL_MS:-3000}
      CHAIN_CONFIRM_BATCH_SIZE: ${CHAIN_CONFIRM_BATCH_SIZE:-50}
      CHAIN_RECOVERY_LOOKBACK_BLOCKS: ${CHAIN_RECOVERY_LOOKBACK_BLOCKS:-20000}
      ANCHOR_CONTRACT_ADDRESS: ${ANCHOR_CONTRACT_ADDRESS:-}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  mysql_data:
  mongo_data:
