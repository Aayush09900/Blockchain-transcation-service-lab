name: Transaction Service CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transaction-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Application and blockchain tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: blockchain_transactions
          MYSQL_USER: transaction_service
          MYSQL_PASSWORD: postgres
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -utransaction_service -ppostgres --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      RUN_INTEGRATION_TESTS: "true"
      MYSQL_URL: mysql://transaction_service:postgres@127.0.0.1:3306/blockchain_transactions
      MONGO_URL: mongodb://127.0.0.1:27017
      MONGO_TEST_DATABASE: blockchain_transaction_audit_test

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.3
          package-manager-cache: false

      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Syntax check
        run: |
          find src scripts test hardhat-tests -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Application tests
        run: npm test

      - name: Hardhat compile
        run: npm run chain:compile

      - name: Hardhat tests
        run: npm run test:hardhat:ci

      - name: Repository health check
        run: npm run verify

      - name: Build container
        run: docker build --tag blockchain-transaction-service:ci .

      - name: Scan container image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: blockchain-transaction-service:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
