name: Transaction Service CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transaction-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node.js tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Syntax check
        run: |
          find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Test
        run: npm test

      - name: Repository health check
        run: npm run verify

      - name: Build container
        run: docker build --tag blockchain-transaction-service:ci .
