name: Transaction Service CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transaction-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Application and blockchain tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: blockchain_transactions
          MYSQL_USER: transaction_service
          MYSQL_PASSWORD: postgres
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -utransaction_service -ppostgres --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      RUN_INTEGRATION_TESTS: "true"
      MYSQL_URL: mysql://transaction_service:postgres@127.0.0.1:3306/blockchain_transactions
      MONGO_URL: mongodb://127.0.0.1:27017
      MONGO_TEST_DATABASE: blockchain_transaction_audit_test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Syntax check
        run: |
          find src scripts test -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Application tests
        run: npm test

      - name: Hardhat compile
        run: npm run chain:compile

      - name: Hardhat tests
        run: npm run test:hardhat:ci

      - name: Repository health check
        run: npm run verify

      - name: Build container
        run: docker build --tag blockchain-transaction-service:ci .
