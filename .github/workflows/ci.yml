name: Transaction Service CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transaction-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node.js tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: blockchain_transactions
          POSTGRES_USER: transaction_service
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U transaction_service -d blockchain_transactions"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RUN_INTEGRATION_TESTS: "true"
      DATABASE_URL: postgresql://transaction_service:postgres@localhost:5432/blockchain_transactions

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Syntax check
        run: |
          find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Test
        run: npm test

      - name: Repository health check
        run: npm run verify

      - name: Build container
        run: docker build --tag blockchain-transaction-service:ci .
