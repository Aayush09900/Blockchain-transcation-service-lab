name: Dependency Audit Notice

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notice:
    name: Dependency graph requirement
    runs-on: ubuntu-latest
    steps:
      - name: Explain audit coverage
        run: |
          echo "Dependency graph is not enabled for this repository."
          echo "The main Security Checks workflow runs npm audit --audit-level=high."
          echo "Enable GitHub Dependency Graph to use actions/dependency-review-action in the future."
