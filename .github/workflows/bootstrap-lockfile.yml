name: Bootstrap npm lockfile

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: bootstrap-lockfile
  cancel-in-progress: false

jobs:
  generate:
    if: ${{ github.ref == 'refs/heads/main' && hashFiles('package-lock.json') == '' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.3
          package-manager-cache: false

      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validate clean install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Commit package-lock.json
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s package-lock.json ]; then
            echo "package-lock.json was not generated"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit"
            exit 0
          fi

          git commit -m "chore: add npm lockfile"
          git push
